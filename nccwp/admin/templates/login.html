{% extends "base.html" %}
{% block title %}Sign in · North Coast map desk{% endblock %}
{% block body %}
<h1>Sign in</h1>
<p>This desk is only for people who were invited. There is no public account page.</p>
<form method="post" class="row">
  <label>Email<br><input type="email" name="email" required autocomplete="username"></label>
  <label>Password<br><input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
<p><a href="{{ url_for('forgot') }}">Forgot password</a></p>
{% endblock %}
