<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCCWP · Nehalem HUC-8</title>
  <meta name="description" content="How many people per HUC-8 watershed have drinking water that might be impacted by forestry pesticides and forestry practices. Nehalem watershed boundary.">
  <meta name="theme-color" content="#1a1712">
  <link rel="canonical" href="https://caradmico.github.io/graphicoregon/nccwp-nehalem/">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --ink: #1a1712;
      --teal: #2aa8a0;
      --gold: #d4b05a;
      --gold-soft: #ead7a4;
      --paper: #efe6d4;
      --muted: #a89a78;
      --panel: rgba(26, 23, 18, 0.94);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #2a2620;
    }
    .panel {
      position: fixed;
      z-index: 500;
      top: 16px;
      left: 16px;
      width: min(320px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 18px 20px 16px;
      background: var(--panel);
      color: var(--paper);
      border: 1px solid rgba(212, 176, 90, 0.28);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .kicker {
      margin: 0 0 6px;
      color: var(--teal);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--gold-soft);
      line-height: 1.15;
    }
    .why {
      margin: 0 0 14px;
      font-size: 0.98rem;
      line-height: 1.4;
    }
    dl { margin: 0; }
    dt {
      margin: 10px 0 2px;
      color: var(--teal);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    dd {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }
    a { color: var(--gold-soft); }
    .leaflet-control-attribution {
      background: rgba(26, 23, 18, 0.82) !important;
      color: var(--muted) !important;
      font-family: inherit;
    }
    .leaflet-control-attribution a { color: var(--gold-soft) !important; }
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--ink);
      color: var(--paper);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .leaflet-popup-content {
      margin: 12px 14px;
      font-family: inherit;
      line-height: 1.35;
    }
    .leaflet-popup-content strong {
      display: block;
      margin-bottom: 4px;
      color: var(--gold-soft);
      font-size: 1.05rem;
    }
    .leaflet-popup-content .pop-line {
      color: var(--paper);
      font-size: 0.92rem;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: var(--muted);
    }
    .status {
      position: fixed;
      z-index: 400;
      right: 16px;
      bottom: 28px;
      max-width: min(420px, calc(100vw - 32px));
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid rgba(212, 176, 90, 0.28);
      color: var(--gold-soft);
      font-size: 0.88rem;
    }
    .status[hidden] { display: none; }
    @media (max-width: 640px) {
      .panel {
        top: auto;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 42vh;
        border: 0;
        border-top: 1px solid rgba(212, 176, 90, 0.28);
      }
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Nehalem HUC-8 watershed map"></div>
  <aside class="panel">
    <p class="kicker">NCCWP · draft</p>
    <h1>Nehalem</h1>
    <p class="why">You’re here to see how many people per HUC-8 watershed have drinking water that might be impacted by forestry pesticides and forestry practices.</p>
    <dl>
      <dt>On the map</dt>
      <dd>Watershed boundary</dd>
      <dt>HUC-8</dt>
      <dd id="huc-code">17100202</dd>
      <dt>Area</dt>
      <dd id="huc-area"></dd>
    </dl>
    <p class="hint">Click the outline.</p>
  </aside>
  <div id="status" class="status" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function () {
      const status = document.getElementById("status");
      function showStatus(msg) {
        status.hidden = false;
        status.textContent = msg;
      }

      const map = L.map("map", {
        center: [45.86, -123.49],
        zoom: 9,
        zoomControl: true
      });

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>"
      }).addTo(map);

      const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });

      function popupHtml(props) {
        const name = props.name || "Watershed";
        const huc = props.huc8 ? "HUC-8 " + props.huc8 : "";
        const area = typeof props.areasqkm === "number" ? fmt.format(props.areasqkm) + " km²" : "";
        return (
          "<strong>" + name + "</strong>" +
          "<div class=\"pop-line\">Watershed boundary</div>" +
          (huc ? "<div class=\"pop-line\">" + huc + "</div>" : "") +
          (area ? "<div class=\"pop-line\">" + area + "</div>" : "")
        );
      }

      fetch("data/nehalem_huc8.geojson")
        .then(function (res) {
          if (!res.ok) throw new Error("Watershed boundary missing (" + res.status + ")");
          return res.json();
        })
        .then(function (data) {
          const feat = data && data.features && data.features[0];
          const props = (feat && feat.properties) || {};
          if (props.huc8 !== "17100202") {
            throw new Error("Expected HUC-8 17100202, got " + (props.huc8 || "none"));
          }
          document.getElementById("huc-code").textContent = props.huc8;
          document.getElementById("huc-area").textContent =
            typeof props.areasqkm === "number" ? fmt.format(props.areasqkm) + " km²" : "";

          const layer = L.geoJSON(data, {
            style: {
              color: "#2aa8a0",
              weight: 2,
              fillColor: "#d4b05a",
              fillOpacity: 0.18
            },
            onEachFeature: function (feature, lyr) {
              lyr.bindPopup(popupHtml(feature.properties || {}), {
                maxWidth: 220,
                className: "nccwp-pop"
              });
              lyr.on("mouseover", function () { lyr.setStyle({ weight: 3 }); });
              lyr.on("mouseout", function () { lyr.setStyle({ weight: 2 }); });
            }
          }).addTo(map);
          map.fitBounds(layer.getBounds(), { padding: [28, 28] });
        })
        .catch(function (err) {
          showStatus(err.message || "Could not load watershed boundary");
        });
    })();
  </script>
</body>
</html>
